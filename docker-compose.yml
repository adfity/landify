name: landify

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: landify_app
    restart: "no"
    working_dir: /var/www/html
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - landify

  webserver:
    image: nginx:alpine
    container_name: landify_nginx
    restart: "no"
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - landify

  db:
    image: mysql:8.0
    container_name: landify_db
    restart: "no"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - landify-db-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - landify

  node:
    image: node:16
    container_name: landify_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run dev"
    profiles: ["tools"]
    networks:
      - landify

networks:
  landify:
    driver: bridge

volumes:
  landify-db-data: